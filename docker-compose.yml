services:
  api:
    build: .
    command: ["api"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag_app
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DOCUMENT_STORAGE_PATH: /app/storage/documents
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/storage
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag_app
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DOCUMENT_STORAGE_PATH: /app/storage/documents
    volumes:
      - document_storage:/app/storage
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_app
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  document_storage:
  chroma_data:
